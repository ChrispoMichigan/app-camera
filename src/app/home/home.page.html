<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title> Blank </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Photo Galery</ion-title>
    </ion-toolbar>
  </ion-header>

  <div id="container">
    <button (click)="takePicture()">
      <ion-icon name="camera-outline" class="camera-button" color="primary">

      </ion-icon>
    </button>
    <img *ngIf="photo" [src]="photo" alt="imagen-subida"/>
  </div>
</ion-content>
